name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # Exportación de investigación: contra el esquema REAL y la RLS en un PostgreSQL efímero (las
  # migraciones viven en el historial canónico del proyecto Supabase compartido, ramonmorillo/dermapex)
  # y ruta SPSS verificada con GNU PSPP (cada .sps se ejecuta y el .sav se compara celda a celda).
  export:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coamo_export
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coamo_export
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout canonical migrations (ramonmorillo/dermapex)
        uses: actions/checkout@v4
        with:
          repository: ramonmorillo/dermapex
          path: canonical-db

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PSPP and pyreadstat
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q pspp postgresql-client
          python -m pip install pyreadstat pandas

      # Stubs de Supabase + migraciones + baterías de RLS (estas crean las cuentas y pacientes COAMO de prueba).
      - name: Schema, migrations and COAMO test accounts
        run: bash canonical-db/scripts/test-db.sh

      - name: Export against real schema and RLS
        env:
          EXPORT_DB_URL: ${{ env.DATABASE_URL }}
        # --dir tests: el filtro de vitest es por subcadena y, sin acotar, también ejecutaría las pruebas
        # de canonical-db/ (DERMAPEX) contra esta base.
        run: npx vitest run --dir tests tests/researchExport.db.test.ts

      - name: SPSS import validated with PSPP
        run: |
          mkdir -p "$RUNNER_TEMP/export-fixture"
          EXPORT_FIXTURE_DIR="$RUNNER_TEMP/export-fixture" npx vitest run --dir tests tests/researchExport.test.ts -t "PSPP"
          python scripts/validate-export-spss.py "$RUNNER_TEMP/export-fixture/standard" "$RUNNER_TEMP/export-fixture/spanish"
